[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-data-sci-marimo-template"
version = "0.1.0"
description = "Hybrid marimo + scikit-learn + polars + chainladder data science template"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.9.0",
    "polars>=1.0.0",
    "scikit-learn>=1.5.0",
    "chainladder>=0.8.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "plotly>=5.20.0",
    "joblib>=1.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
